<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#121a2b">
<title>Beacon Bay: Gloom Defence</title>
<style>
:root{
  --ink:#f4ecdf; --dim:#a9b3c7; --navy:#121a2b; --navy2:#1b2640; --panel:rgba(22,31,52,.92); --line:rgba(255,255,255,.09);
  --amber:#ffc65c; --amber2:#f2913a; --teal:#4fd1c5; --rose:#ff7a8a; --violet:#9c84ff;
  --c:#cfd6e4; --r:#5fb4ff; --e:#c18bff; --l:#ffcb52;
  --font: "Avenir Next","Nunito","SF Pro Rounded",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--navy);color:var(--ink);font-family:var(--font);overflow:hidden;overscroll-behavior:none;touch-action:none}
canvas#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;background:none}
.hidden{display:none!important}
.screen{position:fixed;inset:0;pointer-events:none}
.screen > *{pointer-events:auto}
.topbar{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:flex;gap:8px;align-items:center}
.sp{flex:1}
.chip{display:flex;align-items:center;gap:6px;background:rgba(10,15,28,.62);border:1px solid var(--line);padding:6px 12px 6px 8px;border-radius:999px;font-weight:800;font-size:15px;backdrop-filter:blur(6px)}
.chip.small{font-size:13px;padding:4px 10px 4px 6px}
.ico{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:-3px}
.ico.coin{background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc43d 45%,#d98a1c);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.ico.gem{border-radius:4px;transform:rotate(45deg) scale(.82);background:linear-gradient(135deg,#b6fff6,#3fd0c9 50%,#1f8f9c)}
.round{width:42px;height:42px;border-radius:50%;background:rgba(10,15,28,.62);border:1px solid var(--line);font-size:18px;display:grid;place-items:center}
.round.small{width:38px;height:38px;font-size:13px;font-weight:900;letter-spacing:-1px}

/* home */
.logo{position:absolute;top:calc(env(safe-area-inset-top) + 50px);left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 4px 0 rgba(0,0,0,.25),0 0 30px rgba(255,190,90,.35)}
.logo .l1{font-size:42px;font-weight:900;letter-spacing:6px;color:var(--amber);line-height:1}
.logo .l2{font-size:30px;font-weight:900;letter-spacing:14px;color:var(--ink);line-height:1.1;margin-left:14px}
.logo .tag{margin-top:8px;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#dfe6f3;text-shadow:0 2px 8px rgba(5,10,25,.95),0 0 2px rgba(5,10,25,.9)}
.homecard{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.45);backdrop-filter:blur(10px)}
.heroline{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.arrow{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.06);font-size:26px;line-height:1;font-weight:700}
.heroinfo{flex:1;text-align:center}
.heroinfo b{display:block;font-size:20px;font-weight:900}
.heroinfo small{color:var(--dim);font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase}
.primary{width:100%;padding:16px;border-radius:18px;font-size:22px;font-weight:900;letter-spacing:1px;color:#2a1704;background:linear-gradient(180deg,#ffd77a,#f29a3a);box-shadow:0 5px 0 #b8611c,0 10px 24px rgba(242,154,58,.35);transition:transform .08s}
.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #b8611c}
.primary.locked{background:linear-gradient(180deg,#59627a,#3c4459);color:#e5e9f2;box-shadow:0 5px 0 #252b3b}
.daily{position:relative;width:100%;margin-top:12px;padding:10px 14px;border-radius:16px;background:linear-gradient(90deg,rgba(79,209,197,.18),rgba(156,132,255,.18));border:1px solid rgba(79,209,197,.35);text-align:left;display:flex;flex-direction:column}
.daily .dl{font-weight:900;font-size:16px}
.daily small{color:var(--dim);font-weight:700;font-size:12px;margin-top:2px}
.daily em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;font-weight:900;background:rgba(0,0,0,.3);padding:4px 10px;border-radius:999px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.grid button{position:relative;padding:9px 4px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-weight:800;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
.grid button span{font-size:22px}
.badge{position:absolute;top:4px;right:6px;min-width:10px;height:10px;border-radius:6px;background:var(--rose);display:none;box-shadow:0 0 8px var(--rose)}
.badge.on{display:block}
.best{text-align:center;color:var(--dim);font-size:12px;font-weight:700;margin-top:10px}

/* hud */
.hudtop{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:10px;right:10px;display:flex;align-items:center;gap:8px}
.wavebox{flex:1;background:rgba(10,15,28,.62);border:1px solid var(--line);border-radius:14px;padding:5px 10px;backdrop-filter:blur(6px)}
.wavebox b{font-size:13px;font-weight:900;letter-spacing:.5px}
.bar{height:7px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),#7ff0e0);border-radius:5px;transition:width .15s}
.towerhp{position:absolute;top:calc(env(safe-area-inset-top) + 56px);left:10px;right:10px;display:flex;align-items:center;gap:6px;pointer-events:none}
.towerhp .tw{font-size:15px}
.towerhp .bar{flex:1;height:9px;margin:0}
.bar.hp i{background:linear-gradient(90deg,#ff8a5c,#ffd36b)}
.towerhp b{font-size:12px;font-weight:900;min-width:52px;text-align:right}
.bossbar{position:absolute;top:calc(env(safe-area-inset-top) + 74px);left:30px;right:30px;text-align:center;pointer-events:none}
.bossbar b{font-size:12px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:#d9c8ff}
.bar.boss{height:8px}
.bar.boss i{background:linear-gradient(90deg,#8c6bff,#e08bff)}
.weapons{position:absolute;left:10px;bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:5px;flex-wrap:wrap;max-width:58%;pointer-events:none}
.weapons span{background:rgba(10,15,28,.6);border:1px solid var(--line);border-radius:10px;padding:3px 6px;font-size:13px;font-weight:900}
.weapons span sub{font-size:10px;color:var(--amber);margin-left:1px}
.ability{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#ffe29a,#f29a3a);box-shadow:0 5px 0 #b8611c,0 0 24px rgba(255,190,90,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.ability span{font-size:30px;line-height:1;position:relative;z-index:1}
.ability small{font-size:10px;font-weight:900;color:#3a2006;text-transform:uppercase;position:relative;z-index:1}
.ability i{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(14,20,36,.78) var(--p,0%),transparent 0)}
.ability.ready{animation:ready 1.2s ease-in-out infinite}
@keyframes ready{50%{box-shadow:0 5px 0 #b8611c,0 0 40px rgba(255,210,120,.95)}}
.hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 110px);text-align:center;font-weight:800;font-size:15px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6);pointer-events:none;animation:hint 1.6s ease-in-out infinite}
@keyframes hint{50%{opacity:.45}}

/* cards */
.overlay{position:fixed;inset:0;background:rgba(8,12,22,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.cardsbox{width:100%;max-width:420px;text-align:center;animation:pop .25s ease-out}
.cardsbox h2{margin:0;font-size:26px;font-weight:900;color:var(--amber)}
.sub{color:var(--dim);font-weight:700;font-size:14px;margin:4px 0 12px}
.cardrow{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.card{position:relative;display:flex;align-items:center;gap:12px;text-align:left;padding:14px 14px 14px 12px;border-radius:18px;background:linear-gradient(180deg,#22304f,#1a2440);border:2px solid var(--rc,#cfd6e4);box-shadow:0 0 0 1px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.35),inset 0 0 30px color-mix(in srgb,var(--rc) 14%,transparent);animation:cardin .35s cubic-bezier(.2,1.4,.4,1) both}
.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}
.card:active{transform:scale(.97)}
.card .ci{font-size:34px;width:52px;height:52px;flex:none;display:grid;place-items:center;border-radius:14px;background:rgba(255,255,255,.07)}
.card b{display:block;font-size:17px;font-weight:900}
.card p{margin:2px 0 0;font-size:13px;color:#c8cfdd;font-weight:600;line-height:1.3}
.card .rt{position:absolute;top:-9px;right:12px;font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase;background:var(--rc);color:#141b2d;padding:2px 8px;border-radius:999px}
.card .lv{font-size:11px;font-weight:900;color:var(--amber);margin-left:6px}
.card.c{--rc:var(--c)}.card.r{--rc:var(--r)}.card.e{--rc:var(--e)}.card.l{--rc:var(--l)}
.card.l{background:linear-gradient(180deg,#3b3220,#231d14)}
@keyframes cardin{from{opacity:0;transform:translateY(24px) scale(.9)}}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
.secondary{padding:11px 18px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:800;font-size:15px}
.secondary:disabled{opacity:.4}

/* banner / toast */
.banner{position:fixed;left:0;right:0;top:38%;text-align:center;z-index:15;pointer-events:none;font-size:34px;font-weight:900;letter-spacing:2px;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px rgba(0,0,0,.5);animation:ban 1.6s ease-out both}
.banner small{display:block;font-size:14px;letter-spacing:3px;color:var(--amber);text-transform:uppercase}
.banner.boss{color:#e3d4ff}
.banner.boss small{color:#ff9fb0}
@keyframes ban{0%{opacity:0;transform:scale(1.6)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%) translateY(20px);background:rgba(10,15,28,.94);border:1px solid var(--line);padding:10px 16px;border-radius:14px;font-weight:800;font-size:14px;max-width:86%;text-align:center;opacity:0;transition:.25s;pointer-events:none;z-index:60}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* modal sheet */
#modal{position:fixed;inset:0;z-index:40;background:rgba(6,10,20,.6);display:flex;align-items:flex-end;justify-content:center}
#modal.center{align-items:center;padding:18px}
.sheet{position:relative;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;background:linear-gradient(180deg,#1f2b47,#161f35);border:1px solid var(--line);border-radius:26px 26px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);animation:up .25s ease-out;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#modal.center .sheet{border-radius:26px;animation:pop .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:0 0 4px;text-align:center;font-size:24px;font-weight:900}
.sheet .close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);font-size:16px;font-weight:900}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:10px}
.item .big{font-size:28px;width:44px;text-align:center;flex:none}
.item .info{flex:1;min-width:0}
.item .info b{display:block;font-size:15px;font-weight:900}
.item .info small{display:block;color:var(--dim);font-size:12px;font-weight:600;line-height:1.3}
.pips{display:flex;gap:3px;margin-top:4px}
.pips i{width:14px;height:5px;border-radius:3px;background:rgba(255,255,255,.14)}
.pips i.on{background:var(--amber)}
.btn{flex:none;padding:9px 12px;border-radius:12px;font-weight:900;font-size:13px;background:linear-gradient(180deg,#ffd77a,#f29a3a);color:#2a1704;box-shadow:0 3px 0 #b8611c;display:flex;align-items:center;gap:5px;white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b8611c}
.btn.teal{background:linear-gradient(180deg,#8ff3e8,#2fb9ad);box-shadow:0 3px 0 #1d7a72;color:#06231f}
.btn.off,.btn:disabled{background:#3a4460;color:#9aa4ba;box-shadow:0 3px 0 #262d40}
.btn.price{background:linear-gradient(180deg,#6b7591,#4a536d);color:#fff;box-shadow:0 3px 0 #2d3347}
.btn .ico{width:14px;height:14px}
.soon{display:inline-block;font-size:9px;font-weight:900;letter-spacing:1px;background:var(--rose);color:#2a0a10;border-radius:6px;padding:1px 5px;margin-left:6px;vertical-align:middle}
.tabs{display:flex;gap:6px;background:rgba(0,0,0,.25);padding:4px;border-radius:14px;margin:10px 0}
.tabs button{flex:1;padding:8px 4px;border-radius:10px;font-weight:800;font-size:13px;color:var(--dim)}
.tabs button.on{background:rgba(255,255,255,.12);color:var(--ink)}
.note{background:rgba(255,122,138,.12);border:1px solid rgba(255,122,138,.4);border-radius:14px;padding:10px 12px;font-size:12.5px;font-weight:600;line-height:1.4;margin-bottom:10px;color:#ffd9de}
.note.info{background:rgba(79,209,197,.1);border-color:rgba(79,209,197,.35);color:#cff7f2}
.row2{display:flex;gap:8px;margin-top:12px}
.row2 > *{flex:1;justify-content:center}
.big-btn{width:100%;margin-top:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.stats div{background:rgba(255,255,255,.05);border-radius:14px;padding:10px;text-align:center}
.stats b{display:block;font-size:22px;font-weight:900}
.stats small{color:var(--dim);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:1px}
.rewards{display:flex;justify-content:center;gap:14px;font-size:20px;font-weight:900;margin:6px 0}
.rewards span{display:flex;align-items:center;gap:6px}
.herocard{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:18px;padding:10px;margin-bottom:8px}
.herocard canvas{width:76px;height:76px;flex:none;border-radius:14px;background:radial-gradient(circle,#2b3a5e,#18213a)}
.herocard.sel{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.passrow{display:grid;grid-template-columns:34px 1fr 1fr;gap:6px;align-items:center;margin-bottom:6px}
.passrow .tier{text-align:center;font-weight:900;color:var(--dim);font-size:13px}
.passcell{display:flex;align-items:center;justify-content:space-between;gap:4px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:7px 8px;font-size:12px;font-weight:800;min-height:40px}
.passcell.gold{background:rgba(255,203,82,.08);border-color:rgba(255,203,82,.25)}
.passcell.done{opacity:.55}
.passcell .btn{padding:5px 8px;font-size:11px}
.xpbar{height:10px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;margin:8px 0 12px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),#ffe7a0)}
.skin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.skin{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:8px;text-align:center}
.skin canvas{width:100%;height:96px;border-radius:12px;background:radial-gradient(circle,#2b3a5e,#18213a)}
.skin b{display:block;font-size:13px;font-weight:900;margin:4px 0}
.skin .btn{margin:0 auto;justify-content:center}
.skin.sel{border-color:var(--amber)}
h3{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin:14px 4px 8px}
.kv{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--dim);padding:2px 4px}
.kv b{color:var(--ink)}
/* ---- v1.0 App Store polish ---- */
html,body{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
a.btn{text-decoration:none}
.btn.toggle{min-width:58px;justify-content:center}
#setBtn.quiet{opacity:.65}
.subnote{font-size:11px;font-weight:600;line-height:1.45}
.subnote a{color:var(--teal)}
.tabs button{white-space:nowrap}
.passcell.gold.done{opacity:.75}

</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="home" class="screen">
  <div class="topbar">
    <div class="chip"><i class="ico coin"></i><b id="hCoins">0</b></div>
    <div class="chip"><i class="ico gem"></i><b id="hGems">0</b></div>
    <div class="sp"></div>
    <button class="round" id="setBtn" aria-label="Settings">⚙️</button>
  </div>
  <div class="logo"><div class="l1">BEACON</div><div class="l2">BAY</div><div class="tag">Hold the light. Poof the Gloom.</div></div>
  <div class="homecard">
    <div class="heroline">
      <button class="arrow" id="heroPrev" aria-label="Previous hero">‹</button>
      <div class="heroinfo"><b id="heroName">Pip</b><small id="heroRole">Ranger</small></div>
      <button class="arrow" id="heroNext" aria-label="Next hero">›</button>
    </div>
    <button class="primary" id="playBtn">Play</button>
    <button class="daily" id="dailyBtn"><span class="dl">📅 Daily Challenge</span><small id="dailySub">…</small><em id="streakTag">🔥 0</em></button>
    <div class="grid">
      <button data-open="upgrades"><span>⬆️</span>Upgrades<i class="badge" id="bUp"></i></button>
      <button data-open="heroes"><span>🦸</span>Heroes</button>
      <button data-open="skins"><span>🎨</span>Skins</button>
      <button data-open="pass"><span>🎟️</span>Pass<i class="badge" id="bPass"></i></button>
      <button data-open="awards"><span>🏆</span>Awards<i class="badge" id="bAw"></i></button>
      <button data-open="shop"><span>🛒</span>Shop</button>
    </div>
    <div class="best" id="bestLine"></div>
  </div>
</div>

<div id="hud" class="screen hidden">
  <div class="hudtop">
    <button class="round small" id="pauseBtn" aria-label="Pause">❚❚</button>
    <div class="wavebox"><b id="waveLbl">Wave 1/15</b><div class="bar"><i id="waveBar"></i></div></div>
    <div class="chip small"><i class="ico coin"></i><b id="runCoins">0</b></div>
  </div>
  <div class="towerhp"><span class="tw">🗼</span><div class="bar hp"><i id="hpBar"></i></div><b id="hpTxt">100</b></div>
  <div class="bossbar hidden" id="bossBar"><b id="bossName">Boss</b><div class="bar boss"><i id="bossFill"></i></div></div>
  <div id="weapons" class="weapons"></div>
  <button id="abilityBtn" class="ability" aria-label="Ability"><i id="abCd"></i><span id="abIcon">🏹</span><small id="abName">Volley</small></button>
  <div class="hint" id="moveHint">Drag anywhere to move your hero</div>
</div>

<div id="cards" class="overlay hidden">
  <div class="cardsbox">
    <h2 id="cardsTitle">Wave cleared!</h2>
    <div class="sub" id="cardsSub">Pick an upgrade</div>
    <div id="cardRow" class="cardrow"></div>
    <button class="secondary" id="rerollBtn">🎲 Reroll</button>
  </div>
</div>

<div id="banner" class="banner hidden"></div>
<div id="modal" class="hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script>
/* Beacon Bay: Gloom Defence. Prototype (all-ages roguelite defence) */
'use strict';
(() => {
const $ = id => document.getElementById(id);
const SAVE_KEY = 'beaconbay_v1_save';
const WW = 360, WH = 640, TX = 180, TY = 330, TOWER_R = 22, MAX_WAVES = 15;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  else if (a === 'pclaim') { const i = +id; if (S.passClaimed.includes(i) || Math.floor(S.passXp / PASS_TIER_XP) <= i) return; S.passClaimed.push(i); grantReward(PASS[i][0]); sfx.buy(); checkAch(); save(); openPass(); }
  else if (a === 'aclaim') { const A = ACH.find(x => x.id === id); if (!S.achClaimed.includes(id)) { S.achClaimed.push(id); S.gems += A.g; sfx.buy(); save(); openAwards(); } }
  else if (a === 'tab') { sfx.click(); openShop(id); }
  else if (a === 'cbuy') { const it = COIN_SHOP.find(x => x.id === id); if (pay(it.cost)) { if (id === 'reroll') S.boosts.reroll++; else if (id === 'head') S.boosts.head++; else if (id === 'gems10') S.gems += 10; save(); toast('Bought: ' + it.n); openShop(); } }
  else if (a === 'gbuy') { const it = GEM_SHOP.find(x => x.id === id); if (id === 'heroMo' && S.heroes.mo) return; if (pay(it.cost)) { if (id === 'coins500') S.coins += 500; else if (id === 'coins1500') S.coins += 1500; else if (id === 'heroMo') { S.heroes.mo = true; checkAch(); } save(); toast('Bought: ' + it.n); openShop(); } }
  else if (a === 'dailyGo') { sfx.click(); startDaily(); }
  else if (a === 'resume') { sfx.click(); closeModal(); R.paused = false; }
  else if (a === 'quitrun') { closeModal(); R.paused = false; endRun(false); }
  else if (a === 'revAd') { if (!R || R.phase !== 'revive') return; b.disabled = true; watchRewarded().then(ok => { if (!R || R.phase !== 'revive') return; if (ok) { closeModal(); revive(); buzz(40); } else b.disabled = false; }); }
  else if (a === 'dbl') { if (!R || R.doubled) return; b.disabled = true; watchRewarded().then(ok => { if (ok === 'web') { toast('Ads only play in the iPhone app.'); b.disabled = false; return; } if (!ok || !R || R.doubled) { b.disabled = false; return; } R.doubled = true; S.coins += R.earned; S.totalCoins += R.earned; save(); sfx.buy(); buzz(30);
      const r = $('dblRow'); if (r) r.innerHTML = `<div class="note info">✓ Coins doubled: +${fmt(R.earned)} more</div>`; const rw = $('sheet').querySelector('.rewards span'); if (rw) rw.innerHTML = `${coinI} +${fmt(R.earned * 2)}`; }); }
  else if (a === 'revGem') { if (S.gems >= 25) { S.gems -= 25; save(); closeModal(); revive(); } }
  else if (a === 'giveup') { closeModal(); endRun(false); }
  else if (a === 'again') { sfx.click(); if (R && R.daily) startDaily(); else startRun({}); }
  else if (a === 'home') { sfx.click(); closeModal(); R = null; showScreen('home'); }
  else if (a === 'goUpgrades') { R = null; showScreen('home'); openUpgrades(); }
});

// ---- input ----
const joy = { on: false, ox: 0, oy: 0, x: 0, y: 0, id: null };
const keys = {};
cv.addEventListener('pointerdown', e => { initAudio(); if (!R || $('hud').classList.contains('hidden')) return; joy.on = true; joy.id = e.pointerId; joy.ox = joy.x = e.clientX; joy.oy = joy.y = e.clientY; try { cv.setPointerCapture(e.pointerId); } catch (er) {} });
cv.addEventListener('pointermove', e => { if (joy.on && e.pointerId === joy.id) { joy.x = e.clientX; joy.y = e.clientY; } });
const joyEnd = e => { if (e.pointerId === joy.id) { joy.on = false; } };
cv.addEventListener('pointerup', joyEnd); cv.addEventListener('pointercancel', joyEnd);
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key === ' ' && R) { useAbility(); e.preventDefault(); } });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
function applyInput() {
  let x = 0, y = 0;
  if (joy.on) { const dx = joy.x - joy.ox, dy = joy.y - joy.oy, l = Math.hypot(dx, dy); if (l > 4) { const k = Math.min(1, l / 46); x = dx / l * k; y = dy / l * k; } if (l > 30 && !S.tutDone) $('moveHint').classList.add('hidden'); }
  if (keys.a || keys.arrowleft) x -= 1; if (keys.d || keys.arrowright) x += 1; if (keys.w || keys.arrowup) y -= 1; if (keys.s || keys.arrowdown) y += 1;
  R.input.x = x; R.input.y = y;
}
document.addEventListener('visibilitychange', () => { if (document.hidden) onBackground(); else onForeground(); });
window.addEventListener('pagehide', onBackground); window.addEventListener('blur', () => { if (NAT) onBackground(); });

// ================= LOOP & BOOT =================
const hook = { bot: false, speed: 1 };
let last = performance.now(), T = 0, hudT = 0;
function frame(now) {
  const rawDt = (now - last) / 1000, dt = Math.min(.05, rawDt); last = now; T += dt;
  if (R && !R.paused && R.phase === 'wave' && rawDt < .2) { slowT = rawDt > .024 ? slowT + rawDt : Math.max(0, slowT - rawDt * .5);
    if (slowT > 2.5 && dprCap > 1.5 && (window.devicePixelRatio || 1) > 1.5) { dprCap = dprCap > 2 ? 2 : 1.5; slowT = 0; resize(); } }
  const inRun = R && !$('hud').classList.contains('hidden');
  Music.setMood(!inRun || R.phase === 'over' ? 'home' : R.enemies.some(e => e.boss && !e.dead) ? 'boss' : 'battle');
  if (inRun) {
    if (!R.paused && (R.phase === 'wave' || R.phase === 'intro' || R.phase === 'clear')) {
      for (let i = 0; i < hook.speed; i++) { if (hook.bot) botThink(); else applyInput(); step(dt); if (!(R.phase === 'wave' || R.phase === 'intro' || R.phase === 'clear')) break; }
    } else updateFx(dt);
    if (R) { drawScene(R, T); if ((hudT -= dt) <= 0) { hudT = .1; updateHud(); } }
  } else { updateHome(dt, T); drawScene(homeSt, T, homeAdj()); }
  requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);
resize(); homeSt = makeHomeSt(); showScreen('home'); if (!S.introSeen) openIntro(); nativeBoot();
setTimeout(resize, 300); // safe-area insets can settle after first layout on iOS
requestAnimationFrame(frame);

// test / balancing hooks
window.__bb = { get S() { return S; }, get R() { return R; }, hook, simulate, botPickIndex, pickOffer, useAbility, startRun, startDaily, dailyInfo, save, step,
  speedRun(n) { hook.speed = n; }, get dpr() { return dpr; },
  // art + debug helpers used by scripts/ (icon, splash and App Store screenshot rendering, perf tests)
  art: { drawHero, drawTower, drawGloom, glow, star4, hexA, heroSkin, HERO_SKINS, TOWER_SKINS, ETYPES, TRAILS, mulberry32 },
  get music() { return Music.mood; }, IAP, CFG, grantReward, grantIap, applyCustomerInfo, openShop, openPass, openSkins, openSettings, refreshHome, showCards, spawnEnemy: (...a) => spawnEnemy(...a), drawScene: (...a) => drawScene(...a) };
})();
